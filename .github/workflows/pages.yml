# Builds, tests and publishes the website (apps/web) to GitHub Pages:
# https://yshashi.github.io/ng-email/
#
# The site is also the registry `ng-email add` downloads from (/r), so a
# deploy only happens when the whole test suite passes.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job may write to Pages.
permissions:
  contents: read

# One deployment at a time; don't cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds every package, runs all tests, then builds the site for
      # /ng-email/ (including 404.html) and checks it.
      - run: npm test

      - run: npm run typecheck

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
